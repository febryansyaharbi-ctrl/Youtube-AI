server {
 listen 80;
 server_tokens off;
 root /usr/share/nginx/html;
 client_max_body_size 201m;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob:; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location /api/ {
   proxy_pass http://api:8000;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Proto https;
   proxy_read_timeout 120s;
   access_log off;
 }
 location / { try_files $uri $uri/ /index.html; }
}
