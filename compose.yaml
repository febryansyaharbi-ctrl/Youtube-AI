name: creatorpilot
x-backend: &backend
  build: ./backend
  image: creatorpilot-backend:local
  env_file: .env
  volumes:
    - media:/data
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  depends_on:
    db: {condition: service_healthy}
    redis: {condition: service_healthy}
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: creatorpilot
      POSTGRES_USER: creatorpilot
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, pg_isready -U creatorpilot]
      interval: 10s
      retries: 10
    logging: &logging
      driver: json-file
      options: {max-size: 10m, max-file: '3'}
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes', --maxmemory, 192mb, --maxmemory-policy, noeviction]
    volumes: [redis:/data]
    restart: unless-stopped
    mem_limit: 256m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      retries: 10
    logging: *logging
  api:
    <<: *backend
    mem_limit: 512m
    cpus: 0.75
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 20s
      retries: 10
    logging: *logging
  worker:
    <<: *backend
    command: [celery, -A, app.worker.queue, worker, --loglevel=INFO, --concurrency=1]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 2g
    cpus: 2
    logging: *logging
  scheduler:
    <<: *backend
    command: [python, -m, app.scheduler]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 256m
    cpus: 0.25
    logging: *logging
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_KEEP_ALIVE: 0
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped
    mem_limit: 3500m
    cpus: 2
    logging: *logging
  web:
    build: ./frontend
    ports: ['127.0.0.1:8033:80']
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 128m
    logging: *logging
volumes:
  postgres:
  redis:
  media:
  ollama:
